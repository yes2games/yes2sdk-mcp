name: build and deploy

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Build the image, push it + a request marker to R2, no GitHub creds (ADR-0010).
  # The butler dispatcher (yes2infra#191) polls the marker, mints a GitHub App
  # token, and repository_dispatches deploy-service — replacing the legacy
  # Y2G_TOKEN dispatch this repo used to run.
  build-push-r2:
    uses: yes2games/yes2infra/.github/workflows/build-push-r2.yml@master
    with:
      service-key: yes2sdk-mcp-main
      server: bakso
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
