name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ fromJson(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Headline regression for issue #10: a fresh project must be steered to
      # install the SDK before any namespace code is generated.
      - name: "CUJ: Install Before Codegen"
        run: npx vitest run test/cuj.test.ts
      # Asserts the built dist/ actually starts and advertises all 11 tools over
      # a real JSON-RPC handshake — the in-process tests never exercise that.
      - name: Smoke test the built server
        run: node scripts/smoke-test.mjs
